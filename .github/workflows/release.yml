# Multi-arch (amd64 + arm64 for the Pi) image to GHCR on version tags, with
# signed build provenance. Follows the "Reusable GitHub Actions Pipeline for
# Multi-Arch Docker Images to GHCR" pattern doc in the Local LAN project.
#
# Pin each action to a full commit SHA with the version in a trailing comment
# (e.g. docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0)
# before relying on this; Dependabot (see dependabot.yml) keeps the pins current.
# If you've set up the central reusable workflow, replace the `build` job with:
#   uses: therebelrobot/.github/.github/workflows/docker-build.yml@<SHA>
#   with: { image-name: plinth }
#   secrets: inherit

name: release
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plinth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/plinth
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
